apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: open-data-app
spec:
  selector:
    app: postgres
  ports:
  - port: 5432
    targetPort: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: open-data-web
  namespace: open-data-app
spec:
  type: NodePort
  selector:
    app: open-data-web
  ports:
  - port: 5000
    targetPort: 5000
    nodePort: 30005
