apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: open-data-analytics
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/artemlaskavyi/open-data-ai-analytics.git
    targetRevision: HEAD
    path: gitops/app
  destination:
    server: https://kubernetes.default.svc
    namespace: open-data-app
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
